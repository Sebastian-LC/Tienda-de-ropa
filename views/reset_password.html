<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/style/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>Restablecer contraseña - JAANSTYLE</title>

</head>
<body>
  <section>
  <div>
    <div>
      <img src="../static/logo/logopequeño.png" alt="JAANSTYLE" class="logo-img">
      <h2>Restablecer contraseña</h2>
  <!-- Mensajes -->
  {success_message_div}
  {error_message_div}
  <div id="reset-error" class="alert alert-danger d-none" role="alert"></div>
  <form action="/reset-password" method="POST" id="reset-form">
        <input type="hidden" name="token" value="{token}">
        <div class="mb-3 input-group">
          <i class="bi bi-lock input-icon"></i>
          <div class="password-container">
            <input type="password" class="form-control" id="reset-password" name="password" placeholder="Nueva contraseña" required>
            <button type="button" class="toggle-password" data-target="reset-password" title="Mostrar/ocultar contraseña"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="mb-3 input-group">
          <i class="bi bi-lock input-icon"></i>
          <div class="password-container">
            <input type="password" class="form-control" id="reset-password2" name="password2" placeholder="Repetir contraseña" required>
            <button type="button" class="toggle-password" data-target="reset-password2" title="Mostrar/ocultar contraseña"><i class="fas fa-eye"></i></button>
          </div>
        </div>
  <button type="submit">Restablecer</button>
      </form>
      <div class="mt-3">
        <a href="/"><button>Volver al inicio</button></a>
      </div>
    </div>
  </div>
</section>
<script src="/static/js/reset_password.js"></script>
</body>
</html>
