<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/style/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <title>Olvidé mi contraseña - JAANSTYLE</title>
</head>
<body>
  <section>
    <div>
      <div>
        <img src="../static/logo/logopequeño.png" alt="JAANSTYLE" class="logo-img">
        <h2>Olvidé mi contraseña</h2>
        <!-- Mensaje de éxito o error -->
        {message_div}
  <form action="/reset-password" method="POST" id="forgot-form">
            <i class="bi bi-envelope input-icon"></i>
          <div class="mb-3 input-group">
            <input type="email" class="form-control" name="email" placeholder="Correo electrónico" required>
          </div>
          <div class="mb-3">
            <button type="submit">Enviar enlace de restablecimiento</button>
          </div>
        </form>
        <div class="mt-3">
          <a href="/"><button>Volver al inicio</button></a>
        </div>
      </div>
    </div>
  </section>
  <script src="/static/js/forgot_password.js"></script>
</body>
</html>
